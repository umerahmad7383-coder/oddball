services:
  - type: web
    name: oddball
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL          # required in production (Neon / Supabase / Render Postgres)
        sync: false
      - key: ADMIN_SETUP_TOKEN     # long random text, used once to make yourself admin
        sync: false
      - key: KOFI_VERIFICATION_TOKEN
        sync: false
